services:
  mailpit:
    image: axllent/mailpit:v1.22
    container_name: devsecops_mailpit
    restart: unless-stopped
    environment:
      - MP_MAX_MESSAGES=${MP_MAX_MESSAGES}
    ports:
      - "127.0.0.1:${MP_WEB_PORT}:8025"
      - "127.0.0.1:${MP_SMTP_PORT}:1025"
    networks:
      - devsecops_net

networks:
  devsecops_net:
    external: true

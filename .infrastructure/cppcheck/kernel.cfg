<?xml version="1.0"?>
<def format="2">
  <memory>
    <dealloc>kfree</dealloc>
    <alloc init="false" buffer-size="malloc">kmalloc</alloc>
  </memory>

  <function name="kmalloc">
    <noreturn>false</noreturn>
    <use-retval/>
    <arg nr="1">
      <not-uninit/>
      <valid>1:</valid>
    </arg>
  </function>

  <function name="kfree">
    <noreturn>false</noreturn>
    <arg nr="1">
      <not-uninit/>
    </arg>
  </function>
</def>

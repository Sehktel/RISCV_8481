name: RISC-V Microkernel CI (Stage 7)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-sast:
    runs-on: ubuntu-latest
    container:
      image: riscv_os_devsecops:latest

    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$(pwd)"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" "http://oauth2:${GITHUB_TOKEN}@forgejo:3000/${GITHUB_REPOSITORY}.git" .

      - name: Code Style Gate (clang-format)
        run: make style

      - name: First-Line SAST & Memory Leak Audit (Cppcheck)
        run: make sast

      - name: Cross-Compile Kernel (RV64GC)
        run: |
          make build
          ls -lh bin/kernel.elf bin/kernel.bin

      # Выгрузка артефакта без actions/upload-artifact (без node-контейнера):
      # Forgejo Generic Packages API, работает на чистом curl.
      - name: Publish kernel artifact
        run: |
          # Diagnostics: секрет доходит? какой owner? валиден ли токен?
          echo "PACKAGE_TOKEN: ${PACKAGE_TOKEN:+передан}"
          OWNER="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          echo "Owner: $OWNER | Repository: $GITHUB_REPOSITORY"

          # 1) Проверка токена через Bearer-заголовок
          curl -sS -o /dev/null -w "v1/user (Bearer): %{http_code}\n" \
            -H "Authorization: token ${PACKAGE_TOKEN}" \
            "http://forgejo:3000/api/v1/user"

          # 2) Проверка токена через basic auth (как в выгрузке)
          curl -sS -o /dev/null -w "v1/user (basic): %{http_code}\n" \
            -u "oauth2:${PACKAGE_TOKEN}" \
            "http://forgejo:3000/api/v1/user"

      # curl -sS --fail \
      #   --user "oauth2:${PACKAGE_TOKEN}" \
      #   --upload-file bin/kernel.bin \
      #   "http://forgejo:3000/api/packages/${GITHUB_REPOSITORY_OWNER}/generic/kernel/${GITHUB_SHA}/kernel.bin" \
      #     && echo "Артефакт: Packages -> kernel -> version ${GITHUB_SHA}"


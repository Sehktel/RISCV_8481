# .gitea/workflows/ci.yaml
name: CI

on:
  push:
    branches: [main]

jobs:
  build-and-sast:
    runs-on: self-hosted
    container:
      image: riscv_os_devsecops:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Кэш каталога сборки: инкрементальная пересборка вместо полной
      - name: Cache build directory
        uses: actions/cache@v4
        continue-on-error: true
        with:
          path: build
          key: cmake-${{ hashFiles('src/**', 'cmake/**', 'Makefile') }}
          restore-keys: cmake-

      - name: Code style gate
        run: make style

      - name: SAST (cppcheck)
        run: make sast

      - name: Build kernel
        run: make build

      # Job-контейнер работает от root; возвращаем файлы вашему пользователю
      - name: Fix artifact ownership
        run: chown -R $(id -u):$(id -g) build bin || true

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v3
        with:
          name: kernel-${{ github.sha }}
          path: |
            bin/kernel.bin
            bin/kernel.elf
          retention-days: 7
          if-no-files-found: error

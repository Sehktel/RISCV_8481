name: RISC-V Microkernel CI (Stage 7)

on:
  push:
    branches: [ main, master, ci/qemu-headless]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-sast:
    runs-on: ubuntu-latest
    container:
      image: riscv_os_devsecops:latest

    steps:
      - name: Checkout repository
        run: |
          git config --global --add safe.directory "$(pwd)"
          git clone --depth 1 --branch "${GITHUB_REF_NAME}" "http://oauth2:${GITHUB_TOKEN}@forgejo:3000/${GITHUB_REPOSITORY}.git" .

      - name: Secret Scanning Gate (Gitleaks)
        run: make secrets

      - name: Code Style Gate (clang-format)
        run: make style

      - name: First-Line SAST & Memory Leak Audit (Cppcheck)
        run: make sast

      - name: Advanced SAST - CERT & Bugprone (Clang-Tidy)
        run: make tidy

      - name: Cross-Compile Kernel (RV64GC)
        run: |
          make build
          ls -lh bin/kernel.elf bin/kernel.bin

      - name: Headless smoke test (kernel contract)
        run: make test-smoke

      - name: Headless boot test (MMU validation)
        run: make test-mmu

      # Выгрузка артефакта без actions/upload-artifact (без node-контейнера):
      # Forgejo Generic Packages API, работает на чистом curl.
      - name: Publish kernel artifact
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          PKG_API="http://forgejo:3000/api/packages/${OWNER}/generic/kernel"

          # Идемпотентность: при повторном прогоне того же коммита
          # версия уже существует — Forgejo не разрешает перезапись
          # файла в существующей версии, поэтому удаляем её заранее.
          curl -sS -o /dev/null -u "oauth2:${PACKAGE_TOKEN}" \
            -X DELETE "${PKG_API}/${GITHUB_SHA}" || true

          curl -sS --fail \
            --user "oauth2:${PACKAGE_TOKEN}" \
            --upload-file bin/kernel.bin \
            "${PKG_API}/${GITHUB_SHA}/kernel.bin" \
            && echo "Артефакт: Packages -> kernel -> version ${GITHUB_SHA}"

      - name: Cleanup old package versions (keep last 10)
        env:
          PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER:-${GITHUB_REPOSITORY%%/*}}"
          KEEP=10

          HTTP_CODE=$(curl -sS -w "%{http_code}" -o /tmp/versions.json \
            -u "oauth2:${PACKAGE_TOKEN}" \
            "http://forgejo:3000/api/v1/packages/${OWNER}?type=generic&q=kernel&limit=50")

          echo "HTTP status: ${HTTP_CODE}"

          if [ "${HTTP_CODE}" != "200" ]; then
            echo "API вернул не 200 — прерываем очистку"
            exit 1
          fi

          VERSIONS=$(grep -oE '"version" *: *"[^"]*"' /tmp/versions.json | cut -d'"' -f4)

          echo "Найдено версий: $(echo "$VERSIONS" | wc -w)"
          i=0
          for v in $VERSIONS; do
            i=$((i+1))
            if [ "$i" -le "$KEEP" ]; then
              echo "Оставляем (${i}/${KEEP}): $v"
              continue
            fi
            echo "Удаляю старую версию (${i}): $v"
            curl -sS -o /dev/null -w "  DELETE ${v}: %{http_code}\n" \
              -u "oauth2:${PACKAGE_TOKEN}" \
              -X DELETE \
              "http://forgejo:3000/api/packages/${OWNER}/generic/kernel/${v}"
          done

      - name: ChatOps Report on Success (Mattermost)
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          CLEAN_URL=$(printf '%s' "${WEBHOOK_URL}" | tr -d '\r\n ')
          if [ -z "${CLEAN_URL}" ]; then
            echo "MATTERMOST_WEBHOOK_URL не задан, пропускаем уведомление."
            exit 0
          fi
          curl -f -s -S -X POST -H 'Content-Type: application/json' \
            -d "{
              \"username\": \"RISC-V DevSecOps Bot\",
              \"text\": \"#### :white_check_mark: Сборка и все гейты безопасности пройдены!\n| Параметр | Значение |\n| :--- | :--- |\n| **Репозиторий** | \`${GITHUB_REPOSITORY}\` |\n| **Ветка / Коммит** | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`) |\n| **Инициатор** | @${GITHUB_ACTOR} |\n| **Пайплайн** | [Открыть в Forgejo](http://localhost:3000/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_NUMBER}) |\"
            }" \
            "${CLEAN_URL}"

      - name: ChatOps Alert on Failure (Mattermost)
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.MATTERMOST_WEBHOOK_URL }}
        run: |
          CLEAN_URL=$(printf '%s' "${WEBHOOK_URL}" | tr -d '\r\n ')
          if [ -z "${CLEAN_URL}" ]; then
            echo "MATTERMOST_WEBHOOK_URL не задан, пропускаем уведомление."
            exit 0
          fi
          curl -f -s -S -X POST -H 'Content-Type: application/json' \
            -d "{
              \"username\": \"RISC-V DevSecOps Bot\",
              \"text\": \"#### :rotating_light: Провал CI/CD гейта безопасности!\n| Параметр | Значение |\n| :--- | :--- |\n| **Репозиторий** | \`${GITHUB_REPOSITORY}\` |\n| **Ветка / Коммит** | \`${GITHUB_REF_NAME}\` (\`${GITHUB_SHA}\`) |\n| **Инициатор** | @${GITHUB_ACTOR} |\n| **Лог ошибки** | [Открыть в Forgejo](http://localhost:3000/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_NUMBER}) |\"
            }" \
            "${CLEAN_URL}"
